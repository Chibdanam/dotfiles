# =============================================================================
# Tmux Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# General Settings
# -----------------------------------------------------------------------------

# Use Ctrl+A as prefix (instead of Ctrl+B)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 50000

# Enable true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Reduce escape time for faster response
set -s escape-time 0

# Enable focus events
set -g focus-events on

# -----------------------------------------------------------------------------
# Key Bindings
# -----------------------------------------------------------------------------

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Tmux sessionizer popup (select a ~/dev project, create/attach its session)
bind j display-popup -E -w 75% -h 75% "~/.config/tmux/sessionizer.sh"

# Vim-style pane navigation
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Resize panes with arrow keys
bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5

# Quick window switching
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# -----------------------------------------------------------------------------
# Nested tmux passthrough (local WSL outer <-> remote VM inner over SSH)
# -----------------------------------------------------------------------------
# C-M-o ("Outer") hands ALL keys to the inner tmux: the prefix AND the -n
# root binds above (C-hjkl pane nav, M-1..5). Without this, the local tmux
# eats C-hjkl so remote nvim-tmux-navigation breaks. Red status bar = the
# local tmux is muted and the inner (remote) tmux owns your keystrokes.
#
# Bound identically on every host (same synced config). You only ever toggle
# the OUTERMOST server: while it sits in the `off` table its own C-M-o catches
# the keystroke to restore it, so the key never reaches the inner tmux.
bind -T root C-M-o \
    set prefix None \;\
    set key-table off \;\
    set status-style "bg=colour1 fg=colour15 bold" \;\
    if -F "#{pane_in_mode}" "send-keys -X cancel" \;\
    refresh-client -S

bind -T off C-M-o \
    set -u prefix \;\
    set -u key-table \;\
    set -u status-style \;\
    refresh-client -S

# -----------------------------------------------------------------------------
# Status Bar Configuration
# -----------------------------------------------------------------------------

# Status bar position (top, so terminal-emulator bottom padding doesn't
# look like an empty row underneath the status line)
set -g status-position top

# Explicit single-line status bar; tmux remembers a previously-set
# `status 2` until told otherwise, so set it back so `tmux source` of
# this file actually resets a running server.
set -g status on

set -g status-justify left

# Use the terminal's "bright black" (colour8) slot for the status bar
# background — most themes set this to a subtle gray that contrasts
# with the editor area in both light and dark themes, without
# hardcoding any palette colour.
set -g status-style "bg=colour8 fg=colour15"

# Status bar refresh rate (status only shows session/time/date — 1 Hz is wasted CPU)
set -g status-interval 15

# Status bar length
set -g status-left-length 50
set -g status-right-length 50

# Plain status content so the SSH client terminal controls colors
set -g status-left " #S "
set -g status-right "%H:%M %d-%m-%Y "
# Mark the focused window with brackets + bold so it stands out from
# the others. Both formats end up the same width (text + 4 chars) so
# the rest of the bar doesn't shift when focus changes.
setw -g window-status-format "  #I:#W  "
setw -g window-status-current-format " [#I:#W] "
setw -g window-status-current-style "bold"

# -----------------------------------------------------------------------------
# Plugins (TPM - Tmux Plugin Manager)
# -----------------------------------------------------------------------------

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# tmux-continuum settings (auto-save every 15 minutes)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
